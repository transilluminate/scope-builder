name: Check data and build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to exact commits, not movable tags; the comment gives the release
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate every Trust and build the site
        run: python3 build.py
      - name: Fingerprint reference self-test (Python)
        run: python3 tools/verify_scope.py --self-test
      - name: Page fingerprint code matches the reference (Node)
        run: node tests/check_crypto.js
      - name: Upload the built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: dist/
